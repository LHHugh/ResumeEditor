<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>在线简历编辑器 · Resume Maker</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- 登录遮罩：未登录时覆盖全屏，确保每账号数据隔离 -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <div class="login-logo">📄 在线简历编辑器</div>
      <h2 class="login-title" id="loginTitle">登录简历编辑器</h2>
      <p class="login-sub">登录后你的简历数据将单独保存，不会和其他人互相覆盖。</p>
      <div class="login-field">
        <input type="text" id="loginUser" placeholder="用户名" autocomplete="username" />
      </div>
      <div class="login-field">
        <input type="password" id="loginPw" placeholder="密码（至少 4 位）" autocomplete="current-password" />
      </div>
      <div class="login-error" id="loginError"></div>
      <button class="btn login-primary" id="loginSubmit">登录</button>
      <button class="btn ghost login-secondary" id="loginRegister">注册新账号</button>
      <p class="login-note">纯前端账号：数据仅保存在你当前浏览器中，换设备需重新编辑或导出 JSON 备份。</p>
    </div>
  </div>

  <div id="appRoot">
    <div class="toolbar">
      <div class="tb-left">
        <span class="logo">📄 在线简历编辑器</span>
      </div>
      <div class="tb-right">
        <label class="tb-field">模板
          <select id="tplSelect">
            <option value="tpl-1">默认模板</option>
            <option value="tpl-2">简易模板</option>
            <option value="tpl-3">侧边栏模板</option>
          </select>
        </label>
        <label class="tb-field">语言
          <select id="langSelect">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </label>
        <button class="btn" id="inlineBtn">直接编辑预览</button>
        <button class="btn" id="exportBtn">导出 JSON</button>
        <button class="btn" id="importBtn">导入 JSON</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden />
        <input type="file" id="avatarFile" accept="image/*" hidden />
        <button class="btn" id="printBtn">打印 / PDF</button>
        <button class="btn ghost" id="resetBtn">重置</button>
        <span class="save-hint" id="saveHint">已自动保存</span>
        <span class="user-area hidden" id="userArea">
          <span class="user-label" id="userLabel"></span>
          <button class="btn ghost" id="sponsorBtn">赞助 ♥</button>
          <button class="btn ghost" id="logoutBtn">退出</button>
        </span>
      </div>
    </div>

    <div class="layout">
      <div class="editor" id="editor"><!-- 表单由 app.js 动态生成 --></div>
      <div class="preview-wrap">
        <div class="preview" id="preview"><!-- 简历预览由 app.js 动态生成 --></div>
      </div>
    </div>
  </div>

  <!-- 赞助弹窗（非强制） -->
  <div class="modal-overlay hidden" id="sponsorModal">
    <div class="modal-card">
      <button class="modal-close" id="sponsorClose" title="关闭">×</button>
      <h3 class="modal-title" id="sponsorTitle">如果这个工具帮到了你 💛</h3>
      <p class="modal-text">制作简历免费、无广告。如果愿意，可以请作者喝杯咖啡～ 赞助完全自愿，不影响任何功能。</p>
      <div class="sponsor-qr">
        <img id="sponsorImg" alt="赞助二维码" src="assets/img/alipay-qr.svg" />
      </div>
      <p class="modal-sub">打开支付宝扫一扫即可（截图或用其他扫码工具也行）。</p>
      <div class="modal-actions">
        <button class="btn ghost" id="sponsorClose2">暂不赞助，继续</button>
        <button class="btn" id="sponsorDone">我已赞助 ♥</button>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
